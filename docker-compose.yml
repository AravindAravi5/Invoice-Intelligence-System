version: '3.8'

services:
  invoice-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice-intelligence-api
    ports:
      - "8000:8000"
    volumes:
      - ./temp_uploads:/home/appuser/app/temp_uploads
    environment:
      - LOG_LEVEL=INFO
      - CLUSTERING_EPS=0.3
      - CLUSTERING_MIN_SAMPLES=3
      - ANOMALY_CONTAMINATION=0.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    networks:
      - invoice-network

  invoice-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: invoice-intelligence-ui
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://invoice-api:8000
    depends_on:
      - invoice-api
    restart: unless-stopped
    networks:
      - invoice-network

networks:
  invoice-network:
    driver: bridge
